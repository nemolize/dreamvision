name: Chore
description: Tooling, infra, dependencies, or maintenance work
labels: ["type:chore"]
body:
  - type: markdown
    attributes:
      value: |
        For maintenance that changes no behaviour a user sees — a dependency to
        bump, a script to tidy, a pipeline to fix. A wrong doc belongs in the
        Documentation form.

  - type: textarea
    id: what
    attributes:
      label: What needs doing
      description: |
        The work itself: what changes, and where.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why now
      description: |
        What is worse while this stays undone. Routine upkeep with no trigger
        beyond itself is a fine answer — say so in one line.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which layer this sits in. Pick the one the work would start in.
      options:
        - "not sure"
        - "ui — screens, components, styles"
        - "sim — WebGPU simulation and shaders (src/fluid)"
        - "build — build, compile, lint/format config, dependencies"
        - "ci — CI pipelines and git hooks"
        - "test — test suites and coverage config"
        - "infra — deployment target and runtime environment"
      default: 0
    validations:
      required: true
